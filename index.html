<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Taskly — Gestionnaire de tâches professionnel" />
  <title>MesTâches — Espace de travail</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Lora:ital@0;1&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app-shell" id="app-shell">

    <!-- ─────────────────────────────────────────────────────────
         SIDEBAR
         ───────────────────────────────────────────────────────── -->
    <aside class="sidebar" role="navigation" aria-label="Navigation principale">

      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">
          <img width="50" height="50" src="https://img.icons8.com/ios-filled/50/task.png" alt="task"/>
        </div>
        <span class="brand-name">MesTâches</span>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-section-label">Vues</p>
        <ul class="nav-list" id="views-nav" role="list">

          <li class="nav-item active" data-view="all" role="listitem">
            <span class="nav-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="1.5" y="1.5" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.4"/>
                <rect x="8.5" y="1.5" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.4"/>
                <rect x="1.5" y="8.5" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.4"/>
                <rect x="8.5" y="8.5" width="4" height="4" rx="1" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </span>
            <span class="nav-label">Toutes les tâches</span>
            <span class="nav-badge" id="cnt-all">0</span>
          </li>

          <li class="nav-item" data-view="active" role="listitem">
            <span class="nav-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="7" cy="7" r="2" fill="currentColor"/>
              </svg>
            </span>
            <span class="nav-label">En cours</span>
            <span class="nav-badge" id="cnt-active">0</span>
          </li>

          <li class="nav-item" data-view="done" role="listitem">
            <span class="nav-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4"/>
                <path d="M4.5 7l2 2 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="nav-label">Terminées</span>
            <span class="nav-badge" id="cnt-done">0</span>
          </li>

          <li class="nav-item" data-view="high" role="listitem">
            <span class="nav-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M7 2.5l1.5 3.5h3.5L9.5 8.5l1 3.5L7 10l-3.5 2 1-3.5L2 6h3.5L7 2.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="nav-label">Priorité haute</span>
            <span class="nav-badge urgent" id="cnt-high">0</span>
          </li>

        </ul>
      </nav>

      <nav class="sidebar-nav">
        <p class="nav-section-label">Listes</p>
        <ul class="nav-list" id="lists-nav" role="list">

          <li class="nav-item" data-list="work" role="listitem">
            <span class="nav-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="1.5" y="4.5" width="11" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
                <path d="M4.5 4.5V3.5a.5.5 0 01.5-.5h4a.5.5 0 01.5.5v1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="nav-label">Travail</span>
            <span class="nav-badge" id="cnt-work">0</span>
          </li>

          <li class="nav-item" data-list="perso" role="listitem">
            <span class="nav-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M7 1.5L2 5v7.5h3.5V9h3v3.5H12V5L7 1.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="nav-label">Personnel</span>
            <span class="nav-badge" id="cnt-perso">0</span>
          </li>

          <li class="nav-item" data-list="ideas" role="listitem">
            <span class="nav-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M7 1.5a4 4 0 011.5 7.7V11H5.5V9.2A4 4 0 017 1.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M5.5 12h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="nav-label">Idées</span>
            <span class="nav-badge" id="cnt-ideas">0</span>
          </li>

        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-avatar" aria-hidden="true">SE</div>
          <div class="user-info">
            <span class="user-name">Sky Emmanuel</span>
            <span class="user-role">Assistant Informatique</span>
          </div>
        </div>
      </div>

    </aside>


    <!-- ─────────────────────────────────────────────────────────
         ZONE PRINCIPALE
         ───────────────────────────────────────────────────────── -->
    <div class="main-panel">

      <header class="topbar" role="banner">
        <div class="topbar-left">
          <h1 class="view-title" id="view-title">Toutes les tâches</h1>
          <time class="view-date" id="view-date" datetime=""></time>
        </div>
        <div class="topbar-right">
          <button class="icon-btn" id="sort-btn" title="Inverser l'ordre de tri" aria-label="Trier les tâches">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M2 4h10M4 7h6M6 10h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="icon-btn danger" id="clear-btn" title="Supprimer les tâches terminées" aria-label="Effacer les tâches terminées">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M2 3.5h10M5.5 3.5V2.5h3V3.5M3.5 3.5l.7 8h5.6l.7-8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="main-content" role="main">

        <!-- Ajout de tâche -->
        <section class="add-section" aria-label="Ajouter une tâche">

          <div class="input-card" id="input-card">
            <label class="input-prefix" for="task-input" aria-label="Icône ajout">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/>
                <path d="M8 5.5v5M5.5 8h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </label>
            <input
              type="text"
              id="task-input"
              class="task-input"
              placeholder="Décrivez votre tâche…"
              maxlength="150"
              autocomplete="off"
              aria-label="Nouvelle tâche"
            />
            <button class="submit-btn" id="add-btn" aria-label="Ajouter la tâche">
              Ajouter
            </button>
          </div>

          <div class="input-options">
            <div class="option-group" role="group" aria-label="Priorité">
              <span class="option-label">Priorité</span>
              <div class="priority-selector" id="priority-selector">
                <button class="priority-btn selected" data-p="low" aria-pressed="true">
                  <span class="p-dot" style="background:#16A34A"></span> Basse
                </button>
                <button class="priority-btn" data-p="medium" aria-pressed="false">
                  <span class="p-dot" style="background:#D97706"></span> Moyenne
                </button>
                <button class="priority-btn" data-p="high" aria-pressed="false">
                  <span class="p-dot" style="background:#DC2626"></span> Haute
                </button>
              </div>
            </div>

            <div class="option-group" role="group" aria-label="Liste de destination">
              <label class="option-label" for="list-select">Liste</label>
              <select id="list-select" class="list-select" aria-label="Choisir une liste">
                <option value="work">Travail</option>
                <option value="perso">Personnel</option>
                <option value="ideas">Idées</option>
              </select>
            </div>
          </div>
        </section>

        <!-- Barre de progression -->
        <div class="progress-section" aria-label="Progression">
          <div class="progress-bar-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-bar">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
          <span class="progress-label" id="progress-label">0 tâche</span>
        </div>

        <!-- Onglets -->
        <div class="filter-tabs" role="tablist" aria-label="Filtrer les tâches">
          <button class="tab active" data-tab="all" role="tab" aria-selected="true">
            Toutes <span class="tab-count" id="tab-all">0</span>
          </button>
          <button class="tab" data-tab="active" role="tab" aria-selected="false">
            En cours <span class="tab-count" id="tab-active">0</span>
          </button>
          <button class="tab" data-tab="done" role="tab" aria-selected="false">
            Terminées <span class="tab-count" id="tab-done">0</span>
          </button>
        </div>

        <!-- Liste des tâches -->
        <ul class="tasks-list" id="tasks-list" role="list" aria-label="Liste des tâches" aria-live="polite">
        </ul>

      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
